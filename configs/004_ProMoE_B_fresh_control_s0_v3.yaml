model_name: "ProMoE_TC_B"

gpu_ids: [0, 1, 2, 3]

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
prefetch_factor: 2
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/home/dev/imagenet-1k/sd-vae-ft-mse_Latents_256img_npz"
# An empty strict output bucket still starts at step 0; keeping this true
# makes the source contract identical for the 300K and 500K phases.
resume_checkpoint: True
log_interval: 10
num_steps: 501000
save_ckpt_interval: 50000

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536
    shared_expert_intermediate_size: 1536
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07
    phase_metric_config:
      enabled: False
      rank: 8
      num_fourier_bands: 4
      num_train_timesteps: 1000
      scale: 0.25
      shuffle_timestep: False
      init_seed: 1729

###### For sample
step_list_for_sample: [300000, 500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
