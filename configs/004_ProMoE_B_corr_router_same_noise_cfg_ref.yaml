# Independent inference experiment; reads the same-noise training run's 300K EMA.
# Only the reference velocity differs between cond_ref and cfg_ref.
sample_checkpoint_dir: "outputs/ProMoE_TC_B_corr_router/004_ProMoE_B_corr_router_same_noise/checkpoints"
corr_reference_velocity: cfg
corr_reference_separate_output: True

model_name: "ProMoE_TC_B_corr_router"

gpu_ids: [0, 1, 2, 3]  # placeholder: the wrapper claims idle GPUs at launch

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
prefetch_factor: 2
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/mnt/data2/yujie/code/Dataset/ImageNet/sd-vae-ft-mse_Latents_256img_npz"
resume_checkpoint: False
log_interval: 10
num_steps: 300001
save_ckpt_interval: 50000

DiT_B_config:
  qk_norm: False
  corr_router_config:
    hidden_dim: 256
    skip_intervals: [1, 4, 5, 10, 20, 50]  # thousandths of sigma: one Euler step of a 1000 / 250 / 200 / 100 / 50 / 20-step sampler
    no_reference_prob: 0.5
    previous_state_mode: same_noise
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    shared_expert_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07

###### For sample
step_list_for_sample: [300000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
