# 300K inference only: use the source no_ref_drop EMA in a separate output bucket.
# Only the next-step reference uses conditional velocity; the sampler update still uses the requested CFG.
sample_checkpoint_dir: "outputs/ProMoE_TC_B_clean_route_corr_router/004_ProMoE_B_estimated_route_student_corr_router_kl_detach_base_no_ref_drop/checkpoints"
corr_reference_velocity: conditional
corr_reference_separate_output: true

model_name: ProMoE_TC_B_clean_route_corr_router
gpu_ids: [0, 1, 2, 3]  # placeholder: the wrapper claims idle GPUs at launch
image_size: 256
global_seed: 0
latent_data_path: /mnt/data2/yujie/code/Dataset/ImageNet/sd-vae-ft-mse_Latents_256img_npz

DiT_B_config:
  qk_norm: false
  clean_route_config:
    contrastive_source: student
    teacher_sigma_ratio: 0.0
    align_lam: 0.0005
    align_start_step: 0
    align_warmup_steps: 0
    align_temperature: 0.07
    teacher_input: estimated
    align_detach_base: true
    align_detach_correction: false
  corr_router_config:
    hidden_dim: 256
    skip_intervals:
    - 1
    - 4
    - 5
    - 10
    - 20
    - 50
    no_reference_prob: 0.0
    zero_reference_at_t1000: true
    previous_state_mode: model_velocity
    use_reference_embedding: true
    use_score_input: true
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536
    shared_expert_intermediate_size: 1536
    load_balance_loss_coef: 0
    norm_topk_prob: false
    seq_aux: false
    use_shared_expert: true
    interleave: true
    init_MoeMLP: false
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: true
    routing_contrastive_temperature: 0.07

step_list_for_sample: [300000]
guide_scale_list: [1.0, 1.5]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
save_img_num: 50000
save_inception_features: false
