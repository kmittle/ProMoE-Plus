model_name: "ProMoE_TC_B_regcombo"

gpu_ids: [0, 1]  # placeholder: the wrapper claims idle GPUs at launch

###### For train
# LS-Reg with global counts (2 GPUs, like its single-module counterpart
# configs/004_ProMoE_B_lsreg_diag_idea1_s0p05.yaml): the diagonal offset of
# idea-1 (strength 0.05, sign +1, EMA beta 0.9) with the per-prototype counts
# all-reduced over the GPUs before the EMA, so every GPU uses the same offsets.
# No global class centers, no expert term.  See models/models_ProMoE_TC_regcombo.py.
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
prefetch_factor: 2
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/home/dev/imagenet-1k/sd-vae-ft-mse_Latents_256img_npz"
resume_checkpoint: False
log_interval: 10
num_steps: 501000
save_ckpt_interval: 50000

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    shared_expert_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07
    global_center: False
    ls_diag_strength: 0.05
    ls_diag_sign: 1.0
    ls_ema_beta: 0.9
    ls_count_scope: global

###### For sample
# Sampled and evaluated at 300K and 500K; the 300K result does not stop the run.
step_list_for_sample: [300000, 500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
