# Independent image-wise shared-expert ablation on the base ProMoE-TC model.
# Four image experts; train fresh to 300K, then evaluate both CFG values.
model_name: "ProMoE_TC_B_image_shared"

gpu_ids: [0, 1, 2, 3]  # placeholder: the wrapper claims idle GPUs at launch

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/home/dev/imagenet-1k/sd-vae-ft-mse_Latents_256img_npz"
resume_checkpoint: False
log_interval: 10
num_steps: 300001
save_ckpt_interval: 10000

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536
    shared_expert_intermediate_size: 1536
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07
    num_image_experts: 4
    image_expert_backend: bmm  # FLOPsAccumulator temporarily uses loop.
    image_pool_num_heads: 1  # One learned query, with one attention head.
    image_routing_contrastive_lam: 1.0
    image_routing_contrastive_temperature: 0.07

###### For sample
step_list_for_sample: [300000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
