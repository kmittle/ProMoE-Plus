model_name: "ProMoE_TC_B_ecmix"

gpu_ids: [6, 7]

###### For train
# Training settings follow the conference configs/004_ProMoE_B.yaml, except that
# this batch runs on 2 GPUs (128 images per GPU instead of 64) and adds the latent
# path, data workers, an explicit seed and the checkpoint interval.
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
prefetch_factor: 2
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/home/dev/imagenet-1k/sd-vae-ft-mse_Latents_256img_npz"
# The run script enables resume only when continuing this run.
resume_checkpoint: False
log_interval: 10
num_steps: 501000
save_ckpt_interval: 50000

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    shared_expert_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07
    # Series 1 (loss only): every step routes with TC; the routing-contrastive
    # loss is 0.50 * TC loss + 0.50 * EC loss.
    ecmix_config:
      mode: loss
      schedule: constant
      ratio: 0.5

###### For sample
# This batch is sampled and evaluated only at 500K (no 300K gate or evaluation).
step_list_for_sample: [500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
