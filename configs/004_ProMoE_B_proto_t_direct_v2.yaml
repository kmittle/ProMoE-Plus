model_name: "ProMoE_TC_B_proto_t"

gpu_ids: [1]

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
use_pre_latents: True
resume_checkpoint: True
log_interval: 10
num_steps: 501000

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    shared_expert_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07
    # proto_t: per-sample prototype is generated by MLP(concat(cluster_centers, t_emb)).
    # "direct": prototype_t = proto_proj(cc) + MLP(...). proto_proj identity-init +
    # fc2 zero-init -> step 0 == cc; cc->prototype mapping is trainable (not hardcoded I).
    proto_t_update_mode: "direct"


###### For sample
step_list_for_sample: [300000, 500000]
# sample_every_step: 50000
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
