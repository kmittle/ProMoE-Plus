model_name: "ProMoE_TC_B_regcombo"

gpu_ids: [0, 1]  # placeholder: the wrapper claims idle GPUs at launch

###### For train
# Combination study, parameter arm (2 GPUs): global routing-contrastive class
# centers + LS-Reg diagonal offset (strength 0.05, local counts) + expert
# parameter repulsion mean(exp(-L2/tau)) over the 12 routed experts of DiT block
# index 3 (the 2nd MoE block; "b4" in the 1-indexed file name), lambda 0.5.
# tau 0.7 is the single-module anchor (configs/004_ProMoE_B_expert_contra_param_b4.yaml);
# the other arms sweep tau only.  See models/models_ProMoE_TC_regcombo.py.
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
prefetch_factor: 2
use_pre_latents: True
resume_checkpoint: False
log_interval: 10
num_steps: 501000
save_ckpt_interval: 50000

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    shared_expert_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07
    global_center: True
    ls_diag_strength: 0.05
    ls_diag_sign: 1.0
    ls_ema_beta: 0.9
    ls_count_scope: local
    expert_contrastive_mode: "param"
    expert_contrastive_lam: 0.5
    expert_contrastive_temperature: 50
    expert_contrastive_include_bias: True
    expert_contrastive_blocks: [3]

###### For sample
# Sampled and evaluated at 300K and 500K; the 300K result does not stop the run.
step_list_for_sample: [300000, 500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
