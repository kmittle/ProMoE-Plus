model_name: "ProMoE_TC_B_capacity_combo"

# 2K-step diagnostic probe, NOT an experiment.  Kept as the record of how the
# expert-output L2 repulsion was measured before the four 500K arms were
# committed to a loss form.
#
# Result (logs/log_probe_output_tau10.log, 2026-09-21): at tau=10 the term
# starts at 0.767 (six-block sum) and decays 1278x within 2000 steps --
# 0.767 -> 0.003 by step 200, 0.0006 by step 1200 -- because the pooled pair
# distances grow from ~20 to ~92 as the experts differentiate, and exp(-d/tau)
# collapses with them.  Its effective window is roughly the first 30 steps of a
# 500K run.  At the historical tau=0.5 it is ~1e-18 already at step 0, which is
# why the two historical `expert_contra_output` arms were Base runs with an
# inert term.  No fixed tau survives a distance that keeps growing, so the
# combination study uses the scale-free cosine form instead
# (models/models_ProMoE_TC_dualreg.py, expert_reg_form: cosine).
#
# The probe runs the capacity_combo model with H, R and P switched off so the
# O view is the only active factor -- and because capacity_combo is the only
# model that logs `moe_expert_output_contrastive`, which is precisely why the
# dead term went unnoticed in the historical arms.
gpu_ids: [0, 1]

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 8
prefetch_factor: 2
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/home/dev/imagenet-1k/sd-vae-ft-mse_Latents_256img_npz"
resume_checkpoint: False
log_interval: 10
num_steps: 2001
# The probe is read from the log, not from weights; no checkpoint is wanted.
save_ckpt_interval: 100000

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536
    shared_expert_intermediate_size: 1536
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07
    # H off: homogeneous experts, as in the conference model.
    hetero_expert: False
    # R off: no token-count diagonal offset.
    ls_balance_mode: "off"
    # O only, with the temperature matched to the measured pooled distances.
    expert_contrastive_mode: "output"
    expert_contrastive_temperature: 10
    expert_contrastive_lam: 0.15
    expert_output_blocks: [1, 3, 5, 7, 9, 11]

###### For sample
# The probe never samples; these keep sample.py from choking if it is ever run.
step_list_for_sample: [500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
