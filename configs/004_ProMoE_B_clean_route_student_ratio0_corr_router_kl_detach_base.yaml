# clean teacher＋路由矫正：KL 对本层原分数停止直接梯度
# Fresh 300K -> CFG 1.0/1.5 eval -> own-run 500K -> eval; no FID performance gate.
model_name: ProMoE_TC_B_clean_route_corr_router
gpu_ids: [0, 1, 2, 3]  # placeholder: the wrapper claims idle GPUs at launch
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
prefetch_factor: 2
use_pre_latents: true
use_encoded_latents: true
latent_data_path: /mnt/data2/yujie/code/Dataset/ImageNet/sd-vae-ft-mse_Latents_256img_npz
resume_checkpoint: true
log_interval: 10
num_steps: 500001
save_ckpt_interval: 50000
DiT_B_config:
  qk_norm: false
  clean_route_config:
    contrastive_source: student
    teacher_sigma_ratio: 0.0
    align_lam: 0.0005
    align_start_step: 0
    align_warmup_steps: 0
    align_temperature: 0.07
    align_detach_base: true
  corr_router_config:
    hidden_dim: 256
    skip_intervals:
    - 1
    - 4
    - 5
    - 10
    - 20
    - 50
    no_reference_prob: 0.5
    previous_state_mode: model_velocity
    use_reference_embedding: true
    use_score_input: true
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536
    shared_expert_intermediate_size: 1536
    load_balance_loss_coef: 0
    norm_topk_prob: false
    seq_aux: false
    use_shared_expert: true
    interleave: true
    init_MoeMLP: false
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: true
    routing_contrastive_temperature: 0.07
corr_reference_velocity: cfg
step_list_for_sample:
- 300000
- 500000
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list:
- 1.0
- 1.5
save_img_num: 50000
save_inception_features: false
