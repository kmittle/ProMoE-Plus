# Clean-route routing distillation, first 2x2 batch (models/models_ProMoE_TC_clean_route.py).
# contrastive_source student: the conference routing-contrastive loss on the student's tokens (B arm).
# teacher_sigma_ratio 0: the teacher sees the clean latents at t = 0.
# Every arm: align_lam 5e-4, align_temperature 0.07 (chosen by the smoke test run before this batch).
# Train fresh to 300K, then evaluate CFG 1.0 / 1.5; continue to 500K only if both
# FIDs beat the canonical baseline (30.86 / 9.73).
model_name: "ProMoE_TC_B_clean_route"

gpu_ids: [0, 1, 2, 3]  # placeholder: the wrapper claims idle GPUs at launch

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
prefetch_factor: 2
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/home/dev/imagenet-1k/sd-vae-ft-mse_Latents_256img_npz"
resume_checkpoint: False
log_interval: 10
num_steps: 300001
save_ckpt_interval: 50000

DiT_B_config:
  qk_norm: False
  clean_route_config:
    contrastive_source: student
    teacher_sigma_ratio: 0.0
    align_lam: 0.0005
    align_temperature: 0.07
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    shared_expert_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07

###### For sample
step_list_for_sample: [300000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
