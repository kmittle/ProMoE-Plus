model_name: "ProMoE_TC_B_expert_contra"

gpu_ids: [0, 1, 2, 3]

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/home/dev/imagenet-1k/sd-vae-ft-mse_Latents_256img_npz"
resume_checkpoint: False
log_interval: 10
num_steps: 501000
save_ckpt_interval: 10000

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536
    shared_expert_intermediate_size: 1536
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07
    # Expert representation contrastive config
    # OFAT vs _param baseline: only change is adding BOTH the shared and the
    # unconditional experts to the pairwise repulsion set (12 routed + shared +
    # uncond). Metric stays L2.
    expert_contrastive_lam: 0.5
    expert_contrastive_temperature: 0.7
    expert_contrastive_mode: "param"
    expert_contrastive_blocks: [1, 3, 5, 7, 9, 11]
    expert_contrastive_include_shared: True
    expert_contrastive_include_uncond: True


###### For sample
step_list_for_sample: [300000, 500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
