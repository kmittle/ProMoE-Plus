# Same-run continuation authorized on 2026-10-26: 300K -> 500K.
# Source: configs/004_ProMoE_B_adepth_q0p3_p_only.yaml; preserve this basename to reuse its output/checkpoints.
# The continuation launcher selects the greatest saved step in [300000, 500000].
# All model, optimizer hyperparameters, seed, and batch settings stay unchanged.
model_name: "ProMoE_TC_B_adepth"

gpu_ids: [0, 1, 2, 3]  # placeholder: the wrapper claims idle GPUs at launch

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/mnt/data2/yujie/code/Dataset/ImageNet/sd-vae-ft-mse_Latents_256img_npz"
resume_checkpoint: True
resume_checkpoint_step: 300000  # Minimum for the launcher; exact step for direct train.py use.
log_interval: 10
num_steps: 500001
save_ckpt_interval: 10000

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536
    shared_expert_intermediate_size: 1536
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07
    alloc_mode: fixed_q
    depth_q: 0.3
    depth_warmup: 5000
    depth_keep_ste: False  # True: first-pass STE + second-pass p; False: second-pass p only.
    depth_rank_scope: image  # Rank conditional tokens separately within each image.

###### For sample
step_list_for_sample: [500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
