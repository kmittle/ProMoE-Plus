model_name: "ProMoE_TC_B_capacity_combo"
output_dir: "outputs"

gpu_ids: [0, 1, 2, 3]

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
img_num_workers: 16
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/home/dev/imagenet-1k/sd-vae-ft-mse_Latents_256img_npz"
# The wrapper enables resume only after the first (fresh) phase.
resume_checkpoint: False
log_interval: 10
num_steps: 501000
save_ckpt_interval: 10000

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536
    shared_expert_intermediate_size: 1536
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07
    hetero_expert: True
    hetero_min_ratio: 1.0
    hetero_max_ratio: 3.0
    capacity_aware_lsreg: False
    ls_balance_mode: "off"
    ls_include_empty: True
    # Parameter geometry is represented by a fixed-length signature because
    # heterogeneous experts do not have equal flattened parameter lengths.
    # The parent scalar stays at one; the parameter view is explicitly 0.5.
    expert_contrastive_lam: 1.0
    expert_contrastive_output_lam: 0.0
    expert_contrastive_param_lam: 0.5
    # Match the historical parameter arm (param_b4): exponential L2
    # repulsion at temperature 0.7, applied to a width-invariant signature.
    expert_contrastive_temperature: 0.5
    expert_contrastive_output_temperature: 0.5
    expert_contrastive_param_temperature: 0.7
    expert_contrastive_mode: param_signature
    expert_contrastive_include_bias: True
    expert_contrastive_signature_bins: 32
    expert_contrastive_margin: 0.0
    expert_output_blocks: []
    expert_param_blocks: [3]

###### For sample
step_list_for_sample: [300000, 500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
