model_name: "ProMoE_TC_B_FDRR"

gpu_ids: [4, 5, 6, 7]

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
global_seed: 0
use_pre_latents: True
use_encoded_latents: True
latent_data_path: "/home/dev/imagenet-1k/sd-vae-ft-mse_Latents_256img_npz"
resume_checkpoint: True
log_interval: 10
num_steps: 501000
save_ckpt_interval: 1000
denoising_regret_coeff: 0.05

DiT_B_config:
  qk_norm: False
  denoising_regret_config:
    denoising_regret_block: 3
    denoising_regret_probe_interval: 16
    denoising_regret_token_ratio: 0.0625
    denoising_regret_candidate_mode: "mixed"
    denoising_regret_confidence_quantile: 0.5
    denoising_regret_temperature: 0.1
    denoising_regret_warmup_steps: 10000
    denoising_regret_ramp_steps: 10000
    denoising_regret_label_roll: 0
    denoising_regret_seed: 271828
    denoising_regret_eps: 0.000001
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536
    shared_expert_intermediate_size: 1536
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07

###### For sample
step_list_for_sample: [300000, 500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
