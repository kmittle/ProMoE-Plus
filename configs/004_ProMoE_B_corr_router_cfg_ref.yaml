# Inference only: reuse the original 300K/500K EMA checkpoints; no training.
# Unified reevaluation: resample all four cases in a fresh _cfg_ref bucket.
# Historical conditional-reference and _cfg_ref_300k results stay untouched.
# Only the next-step reference changes: x0_hat = x - sigma * v_cfg.
# A separate experiment bucket uses the same standard internal layout as the source run.
sample_checkpoint_dir: "outputs/ProMoE_TC_B_corr_router/004_ProMoE_B_corr_router/checkpoints"
corr_reference_velocity: cfg
corr_reference_separate_output: True

model_name: "ProMoE_TC_B_corr_router"

gpu_ids: [0, 1, 2, 3]  # placeholder: the wrapper claims idle GPUs at launch

# Model and sampling settings match the source checkpoint's config.
image_size: 256
global_seed: 0

DiT_B_config:
  qk_norm: False
  corr_router_config:
    hidden_dim: 256
    skip_intervals: [1, 4, 5, 10, 20, 50]  # thousandths of sigma: one Euler step of a 1000 / 250 / 200 / 100 / 50 / 20-step sampler
    no_reference_prob: 0.5
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    shared_expert_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07

###### For sample
step_list_for_sample: [300000, 500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False
