model_name: "ProMoE_TC_REPA_Multi_Align_Affinity_B"

gpu_ids: [4, 5, 6, 7]

###### For train
image_size: 256
total_train_batch_size: 256
lr: 0.0001
weight_decay: 0
use_pre_latents: True
resume_checkpoint: True
log_interval: 10
num_steps: 501000
save_ckpt_interval: 1000

DiT_B_config:
  qk_norm: False
  repa_config:
    enc_type: "dinov2-vit-b"
    z_dims: [768]
    projector_dim: 2048
    router_hidden_dim: 768
    num_router_blocks: 2
    router_num_heads: 12
    align_blocks: [2, 3, 4]
    teacher_affinity_block: 3
    teacher_affinity_grid_size: 8
    teacher_affinity_router_temperature: 0.1
    teacher_affinity_relation_temperature: 0.5
    teacher_affinity_eps: 0.000001
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536
    shared_expert_intermediate_size: 1536
    load_balance_loss_coef: 0
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 1
    router_weight_mode: identity
    routing_contrastive_lam: 1
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07

###### For sample
step_list_for_sample: [300000, 500000]
num_fid_samples: 50000
sample_batch_size: 128
sample_steps: 250
sample_shift: 1.0
guide_scale_list: [1.0, 1.5]
save_img_num: 50000
save_inception_features: False

###### REPA config (top-level for train_with_MoS_repa.py)
repa_config:
  enc_type: "dinov2-vit-b"
  proj_coeff: 0.5
  teacher_affinity_coeff: 0.5
